io_torn_pages_protection = double_writes
dwb_num_batches = 16
dwb_batch_pages = 16
# keep sealing and retirement under the test's control
dwb_retire_workers = 0
# wide margin for the hot/quiet lone-seal scenarios: the hot check must run
# within this window of its overflow, the quiet one clearly outside it
dwb_batch_timeout_ms = 200ms
bgwriter_lru_maxpages = 0
autovacuum = off
